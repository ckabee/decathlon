name: decathlon

profile: jaffle_shop_1

  
vars:
  test_dumbbells:
    pre_test_start_week: 28
    pre_test_end_week: 34
    test_start_week: 35
    test_end_week: 41


seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  decathlon:
    +schema: raw

models:
  decathlon:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    int:
      +materialized: table
    marts:
      +materialized: table
